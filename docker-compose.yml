services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-system-app
    ports:
      - '3000:3000'
      - '3001:3001'
    env_file:
      - apps/server/.env
      - apps/web/.env
      - packages/db/.env
    environment:
      - NODE_ENV=development
    restart: on-failure:5
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
