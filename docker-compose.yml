version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: ./apps/nestjs/Dockerfile
    environment:
      NODE_ENV: production
      # Coolify will set these:
      # DATABASE_URL=...
      # DIRECT_URL=...
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: ./apps/nextjs/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
